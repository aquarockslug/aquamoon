# Neovim options for the aquamoon2 configuration.
#
# Read by init.lua, which parses this file with the tinytoml rock (installed
# in lua_modules/, see the README) and applies every entry of the [options]
# table with vim.o[option] = value.
# The "leader" entry is applied as vim.g.mapleader instead.

[options]
background = "dark"
autochdir = true
clipboard = "unnamedplus"
cmdheight = 0
laststatus = 1
number = true
numberwidth = 3
relativenumber = true
scrolloff = 10000
showtabline = 0
signcolumn = "no"
termguicolors = true
smoothscroll = true
winborder = "rounded"
visualbell = true
leader = ","
