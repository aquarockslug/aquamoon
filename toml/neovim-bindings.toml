# Neovim keybindings (loaded by lua/neovim/keymaps.lua) and television
# picker keybindings (tv.nvim, loaded by lua/neovim/plugins.lua).
#
# `leader` sets vim.g.mapleader. Under [map], each key is a mode ("n",
# "x", "t", or a combination such as "nx") whose value is a list of
# [key, action, description] entries. `action` is either a literal key
# sequence/command or a named action from lua/neovim/keymaps.lua, and
# `description` is optional.

leader = ","

[map]
# Normal mode
n = [
  # Search & UI
  ["<leader>h", "mini:starter", "Open starter screen"],
  ["<leader>/", "<CMD>noh<CR>", "Clear search highlighting"],

  # Files (Oil)
  ["-", "<CMD>Oil<CR>", "Open parent directory"],
  ["<leader>;", "oil:vsplit", "Open Oil in vertical split"],
  ["<leader>l", "oil:split", "Open Oil in horizontal split"],

  # Write & quit
  ["<leader>w", "<CMD>write<CR>", "Save file"],
  ["<leader>q", "<CMD>quit<CR>", "Quit window"],
  ["<leader>Q", "<CMD>qa!<CR>", "Force quit all"],

  # Editing
  ["U", "<C-r>", "Redo"],
  ["<C-d>", "<C-d>zz", "Scroll down and center"],
  ["<C-u>", "<C-u>zz", "Scroll up and center"],

  # Windows
  ["<leader>=", "<C-w>=", "Equalize split sizes"],
  ["<leader>x", "<CMD>close<CR>", "Close current split"],
  ["<Left>", "<C-w>h", "Move to left window"],
  ["<Down>", "<C-w>j", "Move to lower window"],
  ["<Up>", "<C-w>k", "Move to upper window"],
  ["<Right>", "<C-w>l", "Move to right window"],

  # Buffers
  ["<Space>", "snipe:menu", "Snipe buffer menu"],
  ["<S-h>", "<CMD>bprevious<CR>", "Previous buffer"],
  ["<S-l>", "<CMD>bnext<CR>", "Next buffer"],

  # Terminal
  ["<leader>tt", "<CMD>terminal<CR>", "Terminal"],
  ["<leader>tl", "terminal:split", "Terminal in horizontal split"],
  ["<leader>t;", "terminal:vsplit", "Terminal in vertical split"],

  # Git
  ["<leader>gg", "neogit:open", "Open Neogit"],
  ["<leader>gc", "neogit:commit", "Neogit commit"],
  ["<leader>go", "mini:diff_overlay", "Toggle git diff overlay"],

  # Logging (Chainsaw)
  ["<leader>k", "chainsaw:menu", "Logging menu"],

  # LSP
  ["gd", "lsp:definition", "Go to definition"],
  ["gr", "lsp:references", "Find references"],
  ["K", "lsp:hover", "Hover documentation"],
  ["<leader>rn", "lsp:rename", "Rename symbol"],
  ["<leader>ca", "lsp:code_action", "Code action"],
  ["[d", "lsp:diagnostic_prev", "Previous diagnostic"],
  ["]d", "lsp:diagnostic_next", "Next diagnostic"],
  ["<leader>d", "lsp:diagnostic_float", "Show diagnostic float"],
  ["<leader>j", "lsp:format_save", "Format and save"],
]

# Visual mode
x = [
  ["<", "<gv", "Indent left and reselect"],
  [">", ">gv", "Indent right and reselect"],
  ["p", '"_dP', "Paste without overwriting register"],
]

# Terminal mode
t = [
  ["<Esc>", '<C-\><C-n>', "Exit terminal mode"],
]

# Normal and visual mode
nx = [
  ["<leader>aa", "sidekick:toggle", "Toggle Sidekick CLI"],
  ["<leader>as", "sidekick:toggle_spawnpoint", "Toggle Sidekick SpawnPoint"],
  ["<leader>ap", "sidekick:prompt", "Sidekick prompt"],
]

# which-key group labels for leader prefixes (loaded by
# lua/neovim/plugins.lua).
[groups]
"<leader>a" = "AI"
"<leader>g" = "Git"
"<leader>k" = "Logging"
"<leader>t" = "Terminal"

# Television picker (tv.nvim). Per-channel shortcuts are trimmed; every
# channel stays reachable through the global picker.
[tv]
channels = "<leader>p"
files = "<leader>f"
text = "<leader>s"
open = "<CR>"
quickfix = "<C-q>"
split = "<C-s>"
vsplit = "<C-v>"
yank = "<C-y>"
