[neovim_options]
leader = ","

[river_options]
border-width = 2
set-repeat = [50, 300]
focus-follows-cursor = "normal"
default-attach-mode = "bottom"
default-layout = "luatile"
output-layout = "luatile"
border-color-focused = "0xb094e2"
border-color-unfocused = "0x92d3c5"

# Single server decoration for these applications.
[window_rules.ssd]
0 = "firefox"
1 = "gimp"
2 = "neovide"
3 = "mpv"
4 = "qutebrowser"
5 = "loupe"

# Tofi menus (luatile layout menu and the project picker). The application
# launcher and the window switcher are Noctalia panels now (toml/mappings.toml).
[tofi]
font = "/usr/share/fonts/TTF/LilexNerdFont-Regular.ttf"
font-size = 14
width = "50%"
height = "50%"
prompt-text = "󰈿_"
background-color = "2a2a3a"
text-color = "92d3c5"
border-color = "92d3c5"
selection-color = "b094e2"
border-width = 2
outline-width = 0
text-cursor = "true"
result-spacing = 9
anchor = "center"
# Used by the legacy tofi launcher helper (lua/util/launcher.lua); the desktop
# launcher itself is the Noctalia launcher.
drun-launch = "true"

# Notifications and OSD are provided by Noctalia and follow its theme
# (toml/noctalia.toml); there are no dunst colours to configure here.
