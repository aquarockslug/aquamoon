# Noctalia Greeter configuration for Aquamoon.
#
# `lua lua/aquamoon.lua setup` installs this file as
# /var/lib/noctalia-greeter/greeter.toml and copies the wallpaper next to it,
# because the greeter runs as the unprivileged greetd user and cannot read
# ~/.aquamoon.  Restart greetd after changing startup, output, input or idle
# settings:  sudo systemctl restart greetd
#
# Docs: https://docs.noctalia.dev/greeter/configuration/

[session]
# Picker label or .desktop filename; see `noctalia-greeter sessions`.
default = "River"

[user]
# Open directly on this account's password step.  Remove to show the picker.
default = "aqua"

[appearance]
# "Synced" uses the declarative palette below; a builtin name such as
# "Noctalia" is also accepted.
scheme = "Synced"
theme_mode = "dark"
font_family = "FairiesevkaTerm Nerd Font Mono"
corner_radius_scale = 1.0
password_style = "default"
hide_logo = true
power_buttons_position = "bottom-right"
scheme_selector_position = "top-right"

[appearance.wallpaper]
# Copied from wallpapers/macos_tiger_grey.png by setup.
path = "/var/lib/noctalia-greeter/wallpaper.png"
fill_mode = "crop"

[clock]
enabled = true
position = "above-panel"
time_format = "{:%I:%M %p}"
date_format = "%A, %x"
time_font_size = 48
date_font_size = 14

[output]
use_synced_settings = true

[cursor]
theme = "Adwaita"
size = 24

[keyboard]
layout = "us"
options = "terminate:ctrl_alt_bksp"
numlock = true

[auth]
allow_empty_password = false
request_timeout = 60
