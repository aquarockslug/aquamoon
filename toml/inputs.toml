# Pointer settings applied on startup.
# The device names are the ones reported by `riverctl list-inputs`.

[Kensington_Eagle_Trackball]
device = "pointer-1149-8264-Kensington_Eagle_Trackball"
pointer-accel = 4

[PIXA200B_Touchpad]
device = "pointer-2362-8203-PIXA200B:00_093A:200B_Touchpad"
pointer-accel = 0.75
tap = "enabled"

[PIXA200B_Mouse]
device = "pointer-2362-8203-PIXA200B:00_093A:200B_Mouse"
pointer-accel = 2
