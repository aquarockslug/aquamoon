# River keybindings for the aquamoon2-river branch
#
# NVIM_APPNAME is set explicitly so that the neovim configuration of this
# repository (~/.config/nvim -> ~/.aquamoon) is used instead of whatever
# NVIM_APPNAME the session inherited.

[map.normal]
[[map.normal.bindings]]
mod = ["Super"]
key = "Return"
command = ["spawn", "\"env NVIM_APPNAME=nvim neovide --no-tabs\""]

[[map.normal.bindings]]
key = "XF86AudioLowerVolume"
opt = "repeat"
command = ["spawn", "\"noctalia msg volume-down\""]

[[map.normal.bindings]]
key = "XF86AudioRaiseVolume"
opt = "repeat"
command = ["spawn", "\"noctalia msg volume-up\""]

[[map.normal.bindings]]
key = "XF86AudioMute"
command = ["spawn", "\"noctalia msg volume-mute\""]

[[map.normal.bindings]]
key = "XF86AudioMicMute"
command = ["spawn", "\"noctalia msg mic-mute\""]

[[map.normal.bindings]]
key = "XF86MonBrightnessDown"
opt = "repeat"
command = ["spawn", "\"noctalia msg brightness-down eDP-1\""]

[[map.normal.bindings]]
key = "XF86MonBrightnessUp"
opt = "repeat"
command = ["spawn", "\"noctalia msg brightness-up eDP-1\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "V"
command = ["spawn", "\"noctalia msg brightness-down eDP-1\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "M"
command = ["spawn", "\"noctalia msg brightness-up eDP-1\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "B"
command = ["spawn", "\"noctalia msg volume-down\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "N"
command = ["spawn", "\"noctalia msg volume-up\""]

[[map.normal.bindings]]
mod = ["Super", "Shift"]
key = "S"
command = ["lua-script", "util/screenshot"]

[[map.normal.bindings]]
mod = ["Super"]
key = "Q"
command = ["close"]

[[map.normal.bindings]]
mod = ["Super"]
key = "E"
command = ["zoom"]

[[map.normal.bindings]]
mod = ["Super"]
key = "D"
command = ["spawn", "\"noctalia msg panel-toggle launcher\""]

[[map.normal.bindings]]
mod = ["Super", "Shift"]
key = "F"
command = ["toggle-fullscreen"]

[[map.normal.bindings]]
mod = ["Super"]
key = "F"
command = ["spawn", "cosmic-files"]

[[map.normal.bindings]]
mod = ["Super"]
key = "A"
command = ["spawn", "\"env NVIM_APPNAME=nvim neovide --no-tabs +'Tv files'\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "S"
command = ["spawn", "\"env NVIM_APPNAME=nvim neovide --no-tabs +'Tv text'\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "W"
command = ["spawn", "\"noctalia msg window-switcher\""]

# Noctalia panels. The Noctalia bar is disabled (toml/noctalia.toml), so these
# are the only way to reach its menus. panel-toggle closes the panel again
# when the same key is pressed.
[[map.normal.bindings]]
mod = ["Super"]
key = "C"
command = ["spawn", "\"noctalia msg panel-toggle control-center\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "comma"
command = ["spawn", "\"noctalia msg panel-toggle control-center notifications\""]

[[map.normal.bindings]]
mod = ["Super", "Shift"]
key = "V"
command = ["spawn", "\"noctalia msg panel-toggle clipboard\""]

[[map.normal.bindings]]
mod = ["Super", "Shift"]
key = "W"
command = ["spawn", "\"noctalia msg panel-toggle wallpaper\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "Escape"
command = ["spawn", "\"noctalia msg panel-toggle session\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "C"
command = ["spawn", "\"noctalia msg settings-toggle\""]

[[map.normal.bindings]]
mod = ["Super", "Alt"]
key = "L"
command = ["spawn", "\"noctalia msg session lock\""]

[[map.normal.bindings]]
mod = ["Super"]
key = "J"
command = ["focus-view", "previous"]

[[map.normal.bindings]]
mod = ["Super"]
key = "K"
command = ["focus-view", "next"]

[[map.normal.bindings]]
mod = ["Super"]
key = "O"
command = ["lua-script", "river/layout_menu"]

[[map.normal.bindings]]
mod = ["Super"]
key = "H"
command = ["set-focused-tags", "1"]

[[map.normal.bindings]]
mod = ["Super"]
key = "L"
command = ["set-focused-tags", "2"]

# WARN modify main ratio not working?
[[map.normal.bindings]]
mod = ["Super", "Shift"]
key = "H"
command = ["send-layout-cmd", "luatile", "\"modify_main_ratio(-1)\""]

[[map.normal.bindings]]
mod = ["Super", "Shift"]
key = "L"
command = ["send-layout-cmd", "luatile", "\"modify_main_ratio(1)\""]

[map-pointer.normal]
[[map-pointer.normal.bindings]]
mod = ["Super"]
key = "BTN_LEFT"
command = ["move-view"]

[[map-pointer.normal.bindings]]
mod = ["Super"]
key = "BTN_RIGHT"
command = ["resize-view"]
