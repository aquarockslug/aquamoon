[wallpaper]
directory = "~/.aquamoon/wallpapers"

[wallpaper.default]
path = "~/.aquamoon/wallpapers/panther.png"

[theme]
mode = "dark"
source = "custom"
custom_palette = "Zephyr"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "qt"]
community_ids = ["cosmic", "steam", "bat", "lazygit", "whitesur-icons", "pywalfox"]

[theme.templates.user.nvim]
input_path = "~/.aquamoon/lua/nvim-template.lua"
output_path = "$XDG_CACHE_HOME/nvim/noctalia.lua"
post_hook = "pkill -SIGUSR1 -f '[n]vim --embed' || true"

[theme.templates.user.television]
input_path = "~/.aquamoon/toml/television-theme.toml"
output_path = "$XDG_CONFIG_HOME/television/themes/noctalia.toml"
