[include]
files = [
  "inputs.toml",
  "bindings.toml",
]

[river_options]
border-width = 2
focus-follows-cursor = "normal"
default-attach-mode = "bottom"
# TODO: sync border colors with noctalia colorscheme
border-color-focused = "0xb094e2"
border-color-unfocused = "0x92d3c5"
# Key repeat: { rate (repeats/second), delay (ms) }.
set-repeat = [50, 300]

[window_rules.ssd]
0 = "firefox"
1 = "gimp"
2 = "neovide"
3 = "mpv"
4 = "qutebrowser"
5 = "loupe"

[tofi]
font = "/usr/share/fonts/TTF/LilexNerdFont-Regular.ttf"
font-size = 14
width = "50%"
height = "50%"
prompt-text = "󰈿_"
background-color = "2a2a3a"
text-color = "92d3c5"
border-color = "92d3c5"
selection-color = "b094e2"
border-width = 2
outline-width = 0
text-cursor = "true"
result-spacing = 9
anchor = "center"

[startup]
0 = ["dbus-update-activation-environment", "DISPLAY", "WAYLAND_DISPLAY", "XDG_SESSION_TYPE", "XDG_CURRENT_DESKTOP"]
# River spawns children with SIGCHLD ignored, which breaks every subprocess
# Noctalia starts (plugins, hooks, checkupdates). Reset it before exec.
1 = ["/usr/bin/env", "--default-signal=CHLD", "noctalia", "--daemon"]
