# Commands spawned when the river session starts.
#
# noctalia is the desktop shell: notification daemon, launcher, control
# center, clipboard, wallpaper, OSD and lock screen. --daemon returns after
# the shell has initialized, so river's startup sequence keeps going. Its bar
# is disabled in toml/noctalia.toml; the panels are opened by the keybindings
# in toml/mappings.toml.
#
# river-luatile is the layout generator river uses for the "luatile" layout
# (see toml/settings.toml and lua/river/layout.lua).

0 = ["dbus-update-activation-environment", "DISPLAY", "WAYLAND_DISPLAY", "XDG_SESSION_TYPE", "XDG_CURRENT_DESKTOP"]
1 = ["noctalia", "--daemon"]
2 = ["river-luatile"]
