[map.normal]
bindings = [
  { mod = "Super", key = "Return", command = ['spawn', 'env NVIM_APPNAME=nvim neovide --no-tabs'] },
  { opt = "repeat", key = "XF86AudioLowerVolume", command = ['spawn', 'noctalia msg volume-down'] },
  { opt = "repeat", key = "XF86AudioRaiseVolume", command = ['spawn', 'noctalia msg volume-up'] },
  { key = "XF86AudioMute", command = ['spawn', 'noctalia msg volume-mute'] },
  { key = "XF86AudioMicMute", command = ['spawn', 'noctalia msg mic-mute'] },
  { opt = "repeat", key = "XF86MonBrightnessDown", command = ['spawn', 'noctalia msg brightness-down eDP-1'] },
  { opt = "repeat", key = "XF86MonBrightnessUp", command = ['spawn', 'noctalia msg brightness-up eDP-1'] },
  { mod = "Super", key = "V", command = ['spawn', 'noctalia msg brightness-down eDP-1'] },
  { mod = "Super", key = "M", command = ['spawn', 'noctalia msg brightness-up eDP-1'] },
  { mod = "Super", key = "B", command = ['spawn', 'noctalia msg volume-down'] },
  { mod = "Super", key = "N", command = ['spawn', 'noctalia msg volume-up'] },
  { mod = "Super+Shift", key = "S", command = ['spawn', 'noctalia msg screenshot-region'] },
  { mod = "Super", key = "Q", command = ['close'] },
  { mod = "Super", key = "D", command = ['spawn', 'noctalia msg panel-toggle launcher'] },
  { mod = "Super+Shift", key = "F", command = ['toggle-fullscreen'] },
  { mod = "Super", key = "F", command = ['spawn', 'cosmic-files'] },
  { mod = "Super", key = "A", command = ['spawn', "env NVIM_APPNAME=nvim neovide --no-tabs +'Tv files'"] },
  { mod = "Super", key = "S", command = ['spawn', "env NVIM_APPNAME=nvim neovide --no-tabs +'Tv text'"] },
  { mod = "Super", key = "W", command = ['spawn', 'noctalia msg window-switcher'] },
  { mod = "Super", key = "C", command = ['spawn', 'noctalia msg panel-toggle control-center'] },
  { mod = "Super+Shift", key = "C", command = ['spawn', 'noctalia msg panel-toggle control-center notifications'] },
  { mod = "Super", key = "comma", command = ['spawn', 'noctalia msg settings-toggle'] },
  { mod = "Super+Shift", key = "V", command = ['spawn', 'noctalia msg panel-toggle clipboard'] },
  { mod = "Super+Shift", key = "W", command = ['spawn', 'noctalia msg panel-toggle wallpaper'] },
  { mod = "Super", key = "Escape", command = ['spawn', 'noctalia msg panel-toggle session'] },
  { mod = "Super+Alt", key = "L", command = ['spawn', 'noctalia msg session lock'] },
  { mod = "Super", key = "J", command = ['focus-view', 'previous'] },
  { mod = "Super", key = "K", command = ['focus-view', 'next'] },
  { mod = "Super", key = "H", command = ['set-focused-tags', '1'] },
  { mod = "Super", key = "L", command = ['set-focused-tags', '2'] },
  # Tiling layout
  { mod = "Super", key = "space", command = ['toggle-floating'] },
  { mod = "Super+Shift", key = "space", command = ['toggle-tiling'] },
  { mod = "Super", key = "equal", command = ['increase-main-ratio'] },
  { mod = "Super", key = "minus", command = ['decrease-main-ratio'] },
  { mod = "Super", key = "g", command = ['toggle-smart-gaps'] },

  { mod = "Super", key = "1", command = ['set-focused-tags', '1'] },
  { mod = "Super", key = "2", command = ['set-focused-tags', '2'] },
  { mod = "Super", key = "3", command = ['set-focused-tags', '4'] },
  { mod = "Super", key = "4", command = ['set-focused-tags', '8'] },
  { mod = "Super", key = "5", command = ['set-focused-tags', '16'] },
  { mod = "Super", key = "6", command = ['set-focused-tags', '32'] },
  { mod = "Super", key = "7", command = ['set-focused-tags', '64'] },
  { mod = "Super", key = "8", command = ['set-focused-tags', '128'] },
  { mod = "Super", key = "9", command = ['set-focused-tags', '256'] },

  { mod = "Super+Shift", key = "1", command = ['set-view-tags', '1'] },
  { mod = "Super+Shift", key = "2", command = ['set-view-tags', '2'] },
  { mod = "Super+Shift", key = "3", command = ['set-view-tags', '4'] },
  { mod = "Super+Shift", key = "4", command = ['set-view-tags', '8'] },
  { mod = "Super+Shift", key = "5", command = ['set-view-tags', '16'] },
  { mod = "Super+Shift", key = "6", command = ['set-view-tags', '32'] },
  { mod = "Super+Shift", key = "7", command = ['set-view-tags', '64'] },
  { mod = "Super+Shift", key = "8", command = ['set-view-tags', '128'] },
  { mod = "Super+Shift", key = "9", command = ['set-view-tags', '256'] },

  { mod = "Super+Control", key = "1", command = ['toggle-focused-tags', '1'] },
  { mod = "Super+Control", key = "2", command = ['toggle-focused-tags', '2'] },
  { mod = "Super+Control", key = "3", command = ['toggle-focused-tags', '4'] },
  { mod = "Super+Control", key = "4", command = ['toggle-focused-tags', '8'] },
  { mod = "Super+Control", key = "5", command = ['toggle-focused-tags', '16'] },
  { mod = "Super+Control", key = "6", command = ['toggle-focused-tags', '32'] },
  { mod = "Super+Control", key = "7", command = ['toggle-focused-tags', '64'] },
  { mod = "Super+Control", key = "8", command = ['toggle-focused-tags', '128'] },
  { mod = "Super+Control", key = "9", command = ['toggle-focused-tags', '256'] },

  { mod = "Super+Alt", key = "1", command = ['toggle-view-tags', '1'] },
  { mod = "Super+Alt", key = "2", command = ['toggle-view-tags', '2'] },
  { mod = "Super+Alt", key = "3", command = ['toggle-view-tags', '4'] },
  { mod = "Super+Alt", key = "4", command = ['toggle-view-tags', '8'] },
  { mod = "Super+Alt", key = "5", command = ['toggle-view-tags', '16'] },
  { mod = "Super+Alt", key = "6", command = ['toggle-view-tags', '32'] },
  { mod = "Super+Alt", key = "7", command = ['toggle-view-tags', '64'] },
  { mod = "Super+Alt", key = "8", command = ['toggle-view-tags', '128'] },
  { mod = "Super+Alt", key = "9", command = ['toggle-view-tags', '256'] },

  { mod = "Super", key = "0", command = ['set-focused-tags', '4294967295'] },
  { mod = "Super+Shift", key = "0", command = ['set-view-tags', '4294967295'] },
]

[map-pointer.normal]
bindings = [
  { mod = "Super", key = "BTN_LEFT", command = ['move-view'] },
  { mod = "Super", key = "BTN_RIGHT", command = ['resize-view'] },
]
