[accessibility]
ui_scale              = 1.0
high_contrast         = false
[shell]
corner_radius_scale   = 1.0
font_family           = "FairiesevkaTerm Nerd Font Mono"
time_format           = "{:%H:%M}"
date_format           = "%A, %x"
offline_mode          = false
telemetry_enabled     = false
niri_overview_type_to_launch_enabled = false
polkit_agent          = true
password_style        = "default"
readline_shortcuts    = false
settings_show_advanced = true
settings_expand_all_groups = false
show_location         = true
clipboard_enabled     = true
clipboard_history_max_entries = 100
clipboard_keep_from_closed_apps = true
clipboard_auto_paste  = "auto"
clipboard_image_action_command = ""
shared_gl_context     = true
[shell.screenshot]
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true
[shell.privacy]
mic_filter_regex = ""
cam_filter_regex = ""
screen_filter_regex = ""
[shell.animation]
enabled = true
speed   = 1.0
[shell.shadow]
direction = "down"
alpha     = 0.55
[shell.panel]
transparency_mode     = "solid"
borders               = true
border_color          = "outline"
border_width          = 1.0
shadow                = true
launcher_placement       = "floating"
clipboard_placement      = "floating"
control_center_placement = "floating"
wallpaper_placement      = "floating"
session_placement        = "floating"
launcher_position        = "center"
clipboard_position       = "center"
control_center_position  = "center"
wallpaper_position       = "center"
session_position         = "center"
open_near_click_control_center = false
open_near_click_launcher       = false
open_near_click_clipboard      = false
open_near_click_wallpaper      = false
open_near_click_session        = false
[shell.launcher]
layout = "full"
width = 760
search_position = "top"
default_view   = "recent"
categories = true
category_icons_only = false
show_settings_button = true
show_session_button = true
show_icons    = true
show_app_origin_indicator = true
compact       = false
app_grid      = false
track_usage   = true
sort_by_usage = true
pinned        = []
fetch_exchange_rates = true
provider_prefix = "/"
auto_paste = "auto"
[shell.launcher.providers.calculator]
prefix = "calc"
global = true
[shell.launcher.providers.emoji]
prefix = "emo"
[shell.launcher.providers.session]
prefix = "session"
global = false
[shell.launcher.providers.wallpaper]
prefix = "wall"
[shell.launcher.providers.windows]
prefix = "win"
[shell.mpris]
blacklist = []
[shell.window_switcher]
style = "carousel"
mru = false
show_caption = true
show_count = true
show_app_icon = true
[wallpaper]
enabled             = true
fill_mode           = "crop"
fill_color          = ""
transition          = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500
edge_smoothness     = 0.3
transition_on_startup = false
directory           = "~/.aquamoon/wallpapers"
directory_light     = ""
directory_dark      = ""
[wallpaper.default]
path = "~/.aquamoon/wallpapers/macos_tiger_grey.png"
[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800
order                      = "random"
recursive                  = true
[theme]
mode   = "dark"
source = "community"
builtin = "Catppuccin"
community_palette = "Catppuccin Frappe Mauve" # Cream
pure_black_dark = true
[theme.templates]
enable_builtin_templates            = true
builtin_ids                = ["gtk3", "gtk4", "qt"]
enable_community_templates = true
community_ids              = ["cosmic", "steam", "bat", "lazygit", "whitesur-icons"]
[theme.templates.user.nvim]
input_path  = "~/.aquamoon/lua/color-template.lua"
output_path = "$XDG_CACHE_HOME/nvim/noctalia.lua"
post_hook   = "pkill -SIGUSR1 -f '[n]vim --embed' || true"
[backdrop]
enabled                = false
blur_intensity         = 0.5
tint_intensity         = 0.3
[notification]
enable_daemon      = true
show_app_name      = true
show_actions       = true
keep_dismissed_in_history = true
layer              = "top"
scale              = 1.0
background_opacity = 0.97
border             = true
border_color       = "outline"
border_width       = 1
follow_focused_output = false
offset_x           = 20
offset_y           = 8
[osd]
position = "top_right"
position_vertical = "top_center"
orientation = "horizontal"
hide_delay_ms = 1400
scale = 1.0
background_opacity = 0.97
border = true
border_color = "outline"
border_width = 1
follow_focused_output = false
offset_x = 20
offset_y = 8
[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
privacy = true
[lockscreen]
enabled                 = true
grace_period_seconds    = 0
blurred_desktop         = false
transition              = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration     = 1500
edge_smoothness         = 0.3
blur_intensity          = 0.5
tint_intensity          = 0.3
[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
cpu_freq_activity_threshold = 2.5
cpu_freq_critical_threshold = 4.5
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0
[calendar]
enabled                     = false
dedupe_events               = false
dedupe_ignore_patterns      = []
refresh_minutes             = 15
event_date_format           = "%A %e %B"
event_time_format           = "%H:%M"
[calendar.reminders]
enabled              = true
use_event_reminders  = true
default_lead_minutes = 10
all_day_digest_time  = "09:00"
[control_center.calendar]
show_events_card            = true
show_week_numbers           = false
[weather]
enabled         = false
refresh_minutes = 30
unit            = "fahrenheit"
effects         = true
[audio]
enable_overdrive = false
enable_sounds = false
enable_volume_sounds = true
enable_notification_sounds = true
enable_power_sounds = true
enable_screenshot_sounds = true
sound_volume = 0.5
sound_theme = "freedesktop"
[brightness]
enable_ddcutil = false
[brightness.monitor.eDP-1]
backend = "backlight"
backlight_device = "intel_backlight"
[nightlight]
enabled              = false
force                = false
temperature_day      = 6500
temperature_night    = 4000
[location]
auto_locate      = false
address          = "Chicago, IL"
[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false
[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = false
[keybinds]
validate = ["return", "kp_enter", "space"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]
delete   = ["del"]
[bar.main]
enabled = true
position = "bottom"
background_opacity = 0.75
reserve_space = false
auto_hide = true
[dock]
enabled             = false
position            = "bottom"
icon_size           = 48
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
radius              = 16
radius_top_left     = 16
radius_top_right    = 16
radius_bottom_left  = 16
radius_bottom_right = 16
margin_ends         = 0
margin_edge         = 8
shadow              = true
show_running        = true
auto_hide           = false
reserve_space       = true
layer               = "top"
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = true
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
show_dots           = false
show_instance_count = true
launcher_position   = "none"
launcher_icon       = "grid-dots"
active_monitor_only = false
pinned              = []
[desktop_widgets]
enabled = false
