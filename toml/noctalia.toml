# Noctalia shell configuration for Aquamoon.
#
# Only intentional, non-default settings are kept here; everything else uses
# Noctalia's built-in defaults. Docs: https://docs.noctalia.dev/noctalia/

[include]
files = [
  "theme.toml",
  "bar.toml",
  "plugins.toml",
]

[shell]
font_family        = "FairiesevkaTerm Nerd Font Mono"
time_format        = "{:%I:%M %p}" # 12-hour clock for shell-owned time displays
polkit_agent       = true

# Panels open as floating windows, centred over the desktop.
[shell.panel]
control_center_placement = "floating"
control_center_position  = "center"
wallpaper_placement      = "floating"
wallpaper_position       = "center"
session_placement        = "floating"
session_position         = "center"

# Keep the launcher search field at the top of the panel.
[shell.launcher]
search_position = "top"

# Quiet desktop: no notification sounds.
[audio]
enable_sounds = false

# Keep the OSD in the top-right corner.
[osd]
position = "top_right"

# The bar is the only shell surface; no dock or desktop widgets.
[desktop_widgets]
enabled = false

# Weather is opt-in, but keep the local unit and city for when it is enabled.
[weather]
enabled = false
unit    = "imperial"

[location]
address = "Chicago, IL"

# Internal panel backlight on the laptop display.
[brightness.monitor.eDP-1]
backend          = "backlight"
backlight_device = "intel_backlight"
