[include]
files = [
  "~/.aquamoon/toml/theme.toml",
  "~/.aquamoon/toml/bar.toml",
  "~/.aquamoon/toml/plugins.toml",
]

[storage]
key_source = "file"
key_file   = "~/.local/state/noctalia/storage.key"

[shell]
font_family  = "FairiesevkaTerm Nerd Font Mono"
time_format  = "{:%I:%M %p}"
polkit_agent = true

[shell.panel]
control_center_placement = "floating"
control_center_position  = "center"
wallpaper_placement      = "floating"
wallpaper_position       = "center"
session_placement        = "floating"
session_position         = "center"

[shell.launcher]
search_position = "top"

[audio]
enable_sounds = false

[osd]
position = "top_right"

[desktop_widgets]
enabled = false

[weather]
enabled = false
unit    = "imperial"

[location]
address = "Chicago, IL"

[brightness.monitor.eDP-1]
backend          = "backlight"
backlight_device = "intel_backlight"

[brightness.monitor.eDP-2]
backend          = "backlight"
backlight_device = "intel_backlight"
