# Shell configuration - generates both Bash and Fish configs

[aliases]
# Colorized output
ls = "ls --color=auto"
grep = "grep --color=auto"
ll = "ls -la"
la = "ls -A"
l = "ls -CF"

# Navigation
".." = "cd .."
"..." = "cd ../.."
"...." = "cd ../../.."

# Common commands
h = "history"
c = "clear"
q = "exit"

# Git shortcuts
gs = "git status"
ga = "git add"
gc = "git commit"
gp = "git push"
gl = "git pull"

[env]
EDITOR = "nvim"
VISUAL = "nvim"
PAGER = "less"
LESSHISTFILE = "-"

[env.paths]
# Additional PATH entries (prepended to PATH)
"$HOME/.local/bin" = true
"$HOME/.cargo/bin" = true
"$HOME/.aquamoon/bin" = true

[functions]
# Simple functions that take arguments
# Format: "name" = "command template"
# Use $@ for all args, $1, $2 for positional

[functions.mkcd]
command = "mkdir -p \"$@\" && cd \"$1\""
description = "Create directory and cd into it"

[functions.extract]
command = "tar -xzf \"$1\" 2>/dev/null || tar -xjf \"$1\" 2>/dev/null || tar -xf \"$1\""
description = "Extract various archive formats"

[functions.fsearch]
command = "find . -name \"*$1*\" 2>/dev/null"
description = "Search for files by name"

[startup]
commands = [
    'eval "$(starship init bash)"',
    'eval "$(tv init bash)"',
]

[startup.fish]
commands = [
    "starship init fish | source",
    "tv init fish | source",
    "",
    "# Fish greeting",
    "function fish_greeting",
    "    echo 'AQUAMOON'",
    "    echo (date '+%I:%M:%S %p - %m/%d/%y')",
    "    echo",
    "end",
]

[shell-options]
# Bash-specific options (set -o)
set_options = ["histappend", "checkwinsize"]

[shell-options.bash]
# Bash-specific set options
shopt = ["cdspell", "dirspell", "checkjobs"]
